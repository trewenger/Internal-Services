<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Internal Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h1 class="text-2xl font-bold mb-2 text-center text-gray-800">Internal Services</h1>
        <p class="text-center text-gray-500 text-sm mb-6">Reset your password</p>

        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm">
            {{ error }}
            {% if not token %}
            <div class="mt-2">
                <a href="{{ url_for('auth.forgot_password') }}" class="text-blue-600 hover:underline">
                    Request a new reset link →
                </a>
            </div>
            {% endif %}
        </div>
        {% endif %}

        {% if token %}
        <form method="POST">
            {% if username %}
            <div class="mb-4">
                <p class="text-sm text-gray-600">
                    Setting password for: <span class="font-semibold text-gray-800">{{ username }}</span>
                </p>
            </div>
            {% endif %}

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                    New Password <span class="text-gray-400 font-normal">(min. 8 characters)</span>
                </label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500"
                       id="password" name="password" type="password" required autofocus minlength="8">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="confirm_password">
                    Confirm Password
                </label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500"
                       id="confirm_password" name="confirm_password" type="password" required>
            </div>

            <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full focus:outline-none transition"
                    type="submit">
                Set New Password
            </button>
        </form>
        {% endif %}

        <div class="text-center mt-4">
            <a href="{{ url_for('auth.login') }}" class="text-sm text-blue-600 hover:underline">Back to login</a>
        </div>
    </div>
</body>
</html>
