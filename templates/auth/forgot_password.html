<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Internal Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h1 class="text-2xl font-bold mb-2 text-center text-gray-800">Internal Services</h1>
        <p class="text-center text-gray-500 text-sm mb-6">Enter your email and we'll send you a reset link.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="px-4 py-3 rounded mb-4
                    {% if category == 'success' %}bg-green-100 border border-green-400 text-green-700
                    {% elif category == 'info' %}bg-blue-100 border border-blue-400 text-blue-700
                    {% else %}bg-red-100 border border-red-400 text-red-700{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="email">
                    Email
                </label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500"
                       id="email" name="email" type="email" required autofocus>
            </div>

            <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full focus:outline-none transition"
                    type="submit">
                Send Reset Link
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{{ url_for('auth.login') }}" class="text-sm text-blue-600 hover:underline">Back to login</a>
        </div>
    </div>
</body>
</html>
